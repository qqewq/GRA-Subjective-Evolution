# Параметры эволюции GRA
eta: 0.05               # скорость градиентного спуска Ψ
beta: -0.1              # коэффициент влияния градиента пены на статус
lambda_subj: 1.0        # вес субъектной пены в общей Φ
gamma_foam: 1.5         # штраф пены в платёжных матрицах
default_r: 0.2          # скорость роста статуса по умолчанию
default_alpha: 0.1      # базовая сила меж-агентной конкуренции
